<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ameya Muralidharan — Mechanical Engineering Portfolio</title>
    <style>
        :root {
            --bg-color: #f7f4ef;          /* Soft warm cream */
            --card-bg: #eae4db;           /* Muted oatmeal / light beige */
            --card-hover: #e0d8cc;        /* Slightly deeper beige for hover */
            --text-primary: #2c2420;      /* Deep espresso brown */
            --text-secondary: #635750;    /* Muted warm taupe */
            --accent: #2f4f3e;            /* Deep forest green */
            --accent-hover: #1f3528;      /* Darker forest green */
            --caramel: #8c6d53;           /* Warm accent brown */
            --border-color: #d8cebf;      /* Subtle border line */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 0 1rem;
        }

        header {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2.5rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--accent);
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Hero Section */
        .hero {
            padding: 4rem 0;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero-bio {
            font-size: 1.15rem;
            color: var(--text-secondary);
            max-width: 800px;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        /* Section Styling */
        section {
            padding: 3.5rem 0;
            border-top: 1px solid var(--border-color);
        }

        section h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--accent);
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.75rem;
            border-radius: 8px;
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
        }

        .card h3 {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-size: 1.25rem;
        }

        .card-date {
            color: var(--caramel);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* Skills */
        .skills-category {
            margin-bottom: 2rem;
        }

        .skills-category h3 {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .skill-tag {
            background-color: var(--card-bg);
            color: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        /* Footer / Contact */
        footer {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

        </nav>
